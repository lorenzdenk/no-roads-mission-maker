name: Android-APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }   # Chaquopy braucht ein Build-Python gleicher Version
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: APK bauen (Debug, mit Debug-Schlüssel signiert und direkt installierbar)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NoRoadsMissionMaker-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: android/app/build/outputs/apk/debug/app-debug.apk }
